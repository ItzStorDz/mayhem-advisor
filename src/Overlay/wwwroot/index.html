<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mayhem Advisor</title>
<style>
  :root {
    --bg: #0a0d13; --text: #eef1f5; --muted: #8b93a1; --line: rgba(255, 255, 255, .07);
    --gold: #c8aa6e; --gold2: #f0d080; --green: #4cd97b; --red: #ff6b6b;
    --op-a: #ff5a5f; --op-b: #ff9f43; --s-a: #ffe08a; --s-b: #c8902e; --a-a: #c29bff; --a-b: #6c5ce7;
    --b-a: #6fd3ff; --b-b: #2f80ed; --c-a: #a9b4bf; --c-b: #5f6b78; --d-a: #7d828a; --d-b: #3d4148;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; color: var(--text); user-select: none;
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    background: radial-gradient(900px 500px at 75% -10%, rgba(120, 90, 255, .14), transparent 60%),
                radial-gradient(800px 500px at 10% 110%, rgba(240, 190, 90, .09), transparent 60%), var(--bg); }
  ::-webkit-scrollbar { width: 10px; } ::-webkit-scrollbar-thumb { background: #243041; border-radius: 99px; border: 2px solid var(--bg); }
  .app { display: grid; grid-template-columns: 220px 1fr; height: 100%; }
  img { display: block; }

  /* Menú */
  nav { padding: 20px 14px 14px; background: rgba(255, 255, 255, .02); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 8px 24px; }
  .hex { width: 34px; height: 34px; flex: none; display: grid; place-items: center; font-weight: 900; color: #1a1206;
    background: linear-gradient(145deg, #ffe7a3, #c8902e); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .brand b { font-size: 15px; } .brand small { display: block; color: var(--muted); font-size: 11.5px; }
  nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: #9aa3b2; font-weight: 600; }
  nav button i { width: 8px; height: 8px; border-radius: 3px; background: #3a4352; }
  nav button:hover { color: var(--text); background: rgba(255, 255, 255, .03); }
  nav button.on { color: #fff; background: linear-gradient(90deg, rgba(240, 200, 110, .18), rgba(240, 200, 110, .02)); box-shadow: inset 3px 0 0 var(--gold2); }
  nav button.on i { background: var(--gold2); }
  .nav-foot { margin-top: auto; padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); font-size: 12px; color: #9aa3b2; }
  .nav-foot b { color: var(--green); } .nav-foot b.off { color: var(--muted); }

  /* Contenido */
  main { overflow-y: auto; padding: 22px 28px 32px; }
  section { display: flex; flex-direction: column; gap: 16px; animation: fade .2s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .top { display: flex; align-items: center; gap: 14px; }
  .top h1 { font-size: 24px; font-weight: 800; flex: 1; letter-spacing: -.01em; }
  .top h1 span { color: var(--muted); font-weight: 600; font-size: 15px; margin-left: 8px; }
  .lang { display: flex; padding: 3px; border-radius: 99px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08); }
  .lang button { all: unset; cursor: pointer; padding: 5px 13px; border-radius: 99px; font-size: 12.5px; font-weight: 800; color: #9aa3b2; }
  .lang button.on { color: #1a1206; background: linear-gradient(180deg, #ffe7a3, #d9a64a); }
  .status { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .status.live { background: rgba(76, 217, 123, .1); border-color: rgba(76, 217, 123, .3); } .status.live i { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .status.wait i { background: var(--gold2); }
  .card { background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .02)); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
  .lbl { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; gap: 10px; }
  .lbl em { font-style: normal; color: var(--gold2); letter-spacing: 0; font-weight: 700; }
  .muted { color: var(--muted); } .up { color: var(--green); } .down { color: var(--red); } .gold { color: var(--gold2); }
  .empty { color: var(--muted); padding: 26px; text-align: center; border: 1px dashed rgba(200, 170, 110, .25); border-radius: 16px; }
  .btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; color: #1a1206; background: linear-gradient(180deg, #ffe7a3, #d9a64a); white-space: nowrap; }
  .btn.ghost { color: var(--text); background: rgba(255, 255, 255, .08); }
  .btn:hover { filter: brightness(1.08); }
  .pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .pill.g { color: var(--green); background: rgba(76, 217, 123, .12); } .pill.r { color: #ff8a8a; background: rgba(255, 107, 107, .12); }
  .pill.n { color: #c9d1da; background: rgba(255, 255, 255, .08); }
  .ico { width: 34px; height: 34px; border-radius: 10px; flex: none; background: #000; object-fit: cover; }
  .ico.r { border-radius: 50%; background: #111; }
  .tier { display: inline-grid; place-items: center; min-width: 28px; height: 22px; padding: 0 7px; border-radius: 7px; font-size: 12px; font-weight: 800;
    color: #120d06; background: linear-gradient(145deg, var(--ga), var(--gb)); }
  .g-OP { --ga: var(--op-a); --gb: var(--op-b); } .g-S { --ga: var(--s-a); --gb: var(--s-b); } .g-A { --ga: var(--a-a); --gb: var(--a-b); }
  .g-B { --ga: var(--b-a); --gb: var(--b-b); } .g-C { --ga: var(--c-a); --gb: var(--c-b); } .g-D, .g-F { --ga: var(--d-a); --gb: var(--d-b); }
  .tier.g-OP, .tier.g-A, .tier.g-B, .tier.g-D, .tier.g-F { color: #fff; }
  .ascore { display: inline-flex; align-items: center; gap: 6px; flex: none; } .ascore b { font-size: 15px; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  .conf { display: inline-flex; gap: 2px; vertical-align: middle; margin-left: 4px; } .conf i { width: 4px; height: 10px; border-radius: 1px; background: rgba(255,255,255,.18); }
  .conf.c1 i:nth-child(-n+1), .conf.c2 i:nth-child(-n+2), .conf.c3 i { background: var(--gold2, #f0c86e); }
  .row { display: flex; align-items: center; gap: 10px; }
  .row + .row { margin-top: 9px; }
  .row .t { flex: 1; min-width: 0; } .row .t b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { color: var(--muted); font-size: 12px; }
  input.search { all: unset; box-sizing: border-box; padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, .05); border: 1px solid var(--line); font-size: 14px; width: 300px; user-select: text; }
  input.search:focus { border-color: var(--gold); }

  /* Inicio */
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .stat { min-width: 0; } .stat b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .stat span { color: var(--muted); font-size: 12.5px; } .stat small { display: block; margin-top: 6px; font-size: 12px; font-weight: 700; }
  .stat .mini { display: flex; align-items: center; gap: 10px; } .stat .mini b { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .mini > div { min-width: 0; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 14px; }
  .match { display: grid; grid-template-columns: 5px 46px 120px 86px auto minmax(0, 1fr) 90px; align-items: center; gap: 12px; padding: 9px 12px 9px 0;
    border-radius: 14px; margin-bottom: 7px; border: 1px solid rgba(255, 255, 255, .05); overflow: hidden; }
  .match .bar { align-self: stretch; } .match.win .bar { background: var(--green); } .match.loss .bar { background: var(--red); }
  .match.win { background: linear-gradient(90deg, rgba(76, 217, 123, .09), rgba(255, 255, 255, .02) 40%); }
  .match.loss { background: linear-gradient(90deg, rgba(255, 107, 107, .09), rgba(255, 255, 255, .02) 40%); }
  .match .ch { width: 46px; height: 46px; border-radius: 12px; }
  .match .r b { display: block; } .match .r span, .match .kda span { color: var(--muted); font-size: 12px; }
  .match .r span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .match .kda b { font-size: 15px; } .match .kda span { display: block; }
  .icons { display: flex; gap: 4px; flex-wrap: wrap; } .icons img { width: 26px; height: 26px; border-radius: 7px; border: 1px solid rgba(255, 255, 255, .12); background: #000; }
  .icons.ai img { border-radius: 50%; background: #111; }
  .when { text-align: right; color: var(--muted); font-size: 12px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 56px; } .chart i { flex: 1; border-radius: 4px 4px 2px 2px; min-height: 8px; }
  .tip { background: linear-gradient(135deg, rgba(240, 200, 110, .14), rgba(120, 90, 255, .09)); border-color: rgba(240, 200, 110, .3); }
  .tip p { font-size: 13.5px; line-height: 1.45; } .tip p + p { margin-top: 8px; }
  .daytip { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(10, 13, 19, .35); border: 1px solid rgba(240, 200, 110, .25); }
  .daytip b { font-size: 12px; color: var(--gold2); } .daytip p { margin-top: 4px; }
  .livecard { display: flex; align-items: center; gap: 14px; }

  /* Campeones */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .chip { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; color: #c9d1da; background: rgba(255, 255, 255, .06); }
  .chip.on { color: #1a1206; background: linear-gradient(180deg, #ffe7a3, #d9a64a); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .tile { cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
  .tile:hover { border-color: rgba(240, 200, 110, .45); background: rgba(240, 200, 110, .06); }
  .tile img { width: 40px; height: 40px; border-radius: 10px; } .tile .t { flex: 1; min-width: 0; }
  .tile .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tile .t span { color: var(--muted); font-size: 12px; }
  .hero { position: relative; overflow: hidden; padding: 0; height: 200px; }
  .hero > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; opacity: .5; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 10%, rgba(10, 13, 19, .55) 55%, transparent); }
  .hero .in { position: relative; z-index: 1; height: 100%; display: flex; gap: 18px; align-items: center; padding: 24px 26px; }
  .hero .in > img { width: 92px; height: 92px; border-radius: 22px; border: 2px solid var(--gold2); }
  .hero h2 { font-size: 32px; font-weight: 800; } .hero .roles { color: #c9d1da; margin: 2px 0 10px; }
  .hero .pills { display: flex; gap: 8px; flex-wrap: wrap; } .hero .pills .pill { font-size: 13.5px; padding: 5px 12px; }
  .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .keyitem { display: inline-block; width: 22px; height: 22px; border-radius: 5px; vertical-align: middle; margin-right: 3px; }
  .back { all: unset; cursor: pointer; color: var(--gold2); font-weight: 700; }

  /* Aumentos */
  .augs { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .aug { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  .aug img { width: 48px; height: 48px; border-radius: 50%; background: #111; border: 2px solid var(--rc); flex: none; }
  .aug .t { flex: 1; min-width: 0; } .aug .rar { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--rc); }
  .aug .t b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .aug .t p { color: var(--muted); font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r-p { --rc: #c29bff; } .r-g { --rc: #f0d080; } .r-s { --rc: #c9d1da; }
  .picker { position: relative; }
  .picker .list { position: absolute; z-index: 5; top: calc(100% + 6px); left: 0; width: 300px; max-height: 320px; overflow-y: auto; padding: 6px; border-radius: 14px;
    background: #121823; border: 1px solid rgba(240, 200, 110, .25); box-shadow: 0 20px 40px -12px #000; }
  .picker .list div { cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 9px; }
  .picker .list div:hover { background: rgba(240, 200, 110, .1); } .picker .list img { width: 28px; height: 28px; border-radius: 7px; }

  /* Ajustes */
  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .settings .col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .opt { cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 15px 18px; }
  .opt > div { flex: 1; } .opt b { display: block; font-size: 15px; } .opt span { color: var(--muted); font-size: 13px; }
  .opt.sub { margin-left: 28px; } .opt.off { opacity: .45; pointer-events: none; }
  .opt input { display: none; }
  .sw { width: 46px; height: 26px; border-radius: 99px; background: #2a3442; position: relative; flex: none; transition: background .2s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #c9d1da; transition: transform .2s, background .2s; }
  .opt input:checked + .sw { background: linear-gradient(90deg, #d9a64a, #f0d080); }
  .opt input:checked + .sw::after { transform: translateX(20px); background: #1a1206; }
  .langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .langs button { all: unset; cursor: pointer; padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .08); }
  .langs button b { display: block; font-size: 18px; } .langs button span { color: var(--muted); font-size: 12.5px; }
  .langs button.on { background: linear-gradient(135deg, rgba(240, 200, 110, .22), rgba(240, 200, 110, .06)); border-color: var(--gold2); }

  /* Acerca de */
  .about .hero2 { display: flex; gap: 18px; align-items: center; } .about .hero2 .hex { width: 70px; height: 70px; font-size: 30px; }
  .about h2 { font-size: 26px; } .about p { margin: 6px 0; color: #d4d9e0; }
  .credit { display: flex; gap: 12px; margin: 7px 0; } .credit b { color: var(--gold2); min-width: 150px; }
  /* Versión nueva (arriba en todas las pestañas, y en Acerca de) */
  .upd { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; border-color: rgba(240, 200, 110, .45);
    background: linear-gradient(135deg, rgba(240, 200, 110, .16), rgba(240, 200, 110, .04)); }
  .about .upd { margin-bottom: 0; }
  .upd .t { flex: 1; min-width: 0; } .upd .t b { display: block; font-size: 14.5px; } .upd .t span { color: #c9d1da; font-size: 12.5px; }
  .upd .bar { height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .1); margin-top: 8px; overflow: hidden; }
  .upd .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffe7a3, #d9a64a); }
  .upd.plain { border-color: var(--line); background: linear-gradient(180deg, rgba(255, 255, 255, .045), rgba(255, 255, 255, .02)); }
  .hidden { display: none !important; }

  /* Ventanas estrechas */
  @media (max-width: 1150px) { .stats { grid-template-columns: repeat(3, 1fr); } .cols { grid-template-columns: 1fr; } .three, .two { grid-template-columns: 1fr; } .settings { grid-template-columns: 1fr; }
    .match { grid-template-columns: 5px 42px 110px 80px minmax(0, 1fr) 80px; } .match .icons:not(.ai) { display: none; } }
</style>
<link rel="stylesheet" href="partidas.css">
<link rel="stylesheet" href="sugerencias.css">
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><span class="hex">M</span><div><b>Mayhem Advisor</b><small data-t="mode"></small></div></div>
    <button data-tab="home" class="on"><i></i><span data-t="nav.home"></span></button>
    <button data-tab="games"><i></i><span data-t="nav.games"></span></button>
    <button data-tab="champs"><i></i><span data-t="nav.champs"></span></button>
    <button data-tab="augs"><i></i><span data-t="nav.augs"></span></button>
    <button data-tab="settings"><i></i><span data-t="nav.settings"></span></button>
    <button data-tab="about"><i></i><span data-t="nav.about"></span></button>
    <button data-tab="feedback"><i></i><span data-t="nav.feedback"></span></button>
    <div class="nav-foot"><span data-t="nav.auto"></span>: <b id="footAuto">–</b><br><span id="footGames"></span></div>
  </nav>

  <main>
    <div class="card upd hidden" id="updBar"></div>
    <div class="card upd plain hidden" id="dataBar"><div class="t"><b data-t="data.title"></b><span data-t="data.text"></span></div>
      <button class="btn ghost" data-data="privacy" data-t="data.details"></button><button class="btn ghost" data-data="off" data-t="data.off"></button><button class="btn" data-data="ok" data-t="data.ok"></button></div>
    <!-- INICIO -->
    <section id="home">
      <div class="top"><h1 id="hello"></h1><div class="status" id="status"><i></i><span></span></div><div class="lang" data-lang></div></div>
      <div class="card livecard hidden" id="liveCard"></div>
      <div class="card hidden" id="statsCard"><div class="lbl"><span data-t="home.stats"></span><em id="statsRange"></em></div><div class="stats" id="stats"></div></div>
      <div class="cols">
        <div class="card"><div class="lbl"><span data-t="home.history"></span><em id="historyCount"></em></div><div id="history"></div></div>
        <div class="side" id="homeSide"></div>
      </div>
    </section>

    <!-- PARTIDAS (partidas.js) -->
    <section id="games" class="hidden">
      <div class="top"><h1 id="gamesTitle"></h1><div class="lang" data-lang></div></div>
      <div id="gamesBody" style="display:flex;flex-direction:column;gap:16px"></div>
    </section>

    <!-- CAMPEONES -->
    <section id="champs" class="hidden">
      <div class="top"><h1><b data-t="nav.champs"></b><span id="champCount"></span></h1><div class="lang" data-lang></div></div>
      <div id="champList">
        <div class="toolbar" style="margin-bottom:14px"><input class="search" id="champSearch">
          <button class="chip on" data-cf="all"></button><button class="chip" data-cf="mine"></button><button class="chip" data-cf="top"></button></div>
        <div class="grid" id="champGrid"></div>
      </div>
      <div id="champDetail" class="hidden"></div>
    </section>

    <!-- AUMENTOS -->
    <section id="augs" class="hidden">
      <div class="top"><h1><b data-t="nav.augs"></b><span data-t="augs.sub"></span></h1><div class="lang" data-lang></div></div>
      <div class="toolbar">
        <div class="picker"><input class="search" id="augSearch"><div class="list hidden" id="augPick"></div></div>
        <button class="chip on" data-rf="all"></button><button class="chip" data-rf="prismatic"></button><button class="chip" data-rf="gold"></button><button class="chip" data-rf="silver"></button>
        <span class="muted" style="margin-left:auto;font-size:13px" data-t="augs.note"></span>
      </div>
      <div id="augHead"></div>
      <div class="augs" id="augGrid"></div>
      <div class="card tip"><div class="lbl gold" data-t="augs.tipTitle"></div><p data-t="augs.tip"></p></div>
    </section>

    <!-- AJUSTES -->
    <section id="settings" class="hidden">
      <div class="top"><h1 data-t="nav.settings"></h1><div class="lang" data-lang></div></div>
      <div class="settings">
        <div class="col">
          <div class="lbl" style="margin:0" data-t="set.game"></div>
          <label class="card opt"><div><b data-t="set.accept"></b><span data-t="set.acceptSub"></span></div><input type="checkbox" data-key="autoAccept"><i class="sw"></i></label>
          <label class="card opt sub" id="optOnly"><div><b data-t="set.only"></b><span data-t="set.onlySub"></span></div><input type="checkbox" data-key="autoAcceptOnlyMayhem"><i class="sw"></i></label>
          <label class="card opt"><div><b data-t="set.panel"></b><span data-t="set.panelSub"></span></div><input type="checkbox" data-key="showPanel"><i class="sw"></i></label>
          <label class="card opt"><div><b data-t="set.augTab"></b><span data-t="set.augTabSub"></span></div><input type="checkbox" data-key="autoAugmentsTab"><i class="sw"></i></label>

// Al volver a la ventana (p. ej. después de una partida) se piden de nuevo el historial y las estadísticas.
window.addEventListener("focus", () => send({ type: "home" }));

// Pestaña pedida al abrir (index.html#acerca, desde la bandeja).
applyStatic();
// Primero «listo»: el programa solo contesta a la página después (si no, la partida pedida por #partida:… se perdía).
send({ type: "ready" });
goto(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
